# Compiling the full generated fixture corpus exhausts the default 512 MiB heap.
# The compiler runs inside the Gradle process rather than in the Kotlin daemon: builds with
# equal daemon arguments share one daemon, so the lanes of a parallel `mdl :test` compiled the
# corpus several times over in a single 2 GiB heap and ran out of it.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx2g
